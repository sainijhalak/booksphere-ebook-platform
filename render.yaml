services:
  - type: web
    name: booksphere-ebook-platform
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn booksphere.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
